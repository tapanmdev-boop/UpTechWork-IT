<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" style="font-family: 'Segoe UI', Arial, sans-serif; background: #0a0f1e;">
  <defs>
    <!-- Gradients -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a6e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0f1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="procurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#003d7a"/>
    </linearGradient>
    <linearGradient id="logistGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00aa88"/>
      <stop offset="100%" stop-color="#006655"/>
    </linearGradient>
    <linearGradient id="bondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc6600"/>
      <stop offset="100%" stop-color="#7a3d00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4499ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00ddaa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff8844"/>
    </marker>
  </defs>

  <!-- Background star field -->
  <rect width="900" height="620" fill="#0a0f1e"/>
  <circle cx="80" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="200" cy="90" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="750" cy="30" r="1" fill="white" opacity="0.6"/>
  <circle cx="850" cy="100" r="1" fill="white" opacity="0.3"/>
  <circle cx="50" cy="300" r="1" fill="white" opacity="0.5"/>
  <circle cx="870" cy="400" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="100" cy="560" r="1" fill="white" opacity="0.3"/>
  <circle cx="800" cy="580" r="1" fill="white" opacity="0.5"/>
  <circle cx="350" cy="20" r="1" fill="white" opacity="0.4"/>
  <circle cx="600" cy="15" r="1" fill="white" opacity="0.6"/>

  <!-- Center glow -->
  <ellipse cx="450" cy="310" rx="220" ry="160" fill="url(#centerGlow)" opacity="0.6"/>

  <!-- TITLE -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e8f4ff" filter="url(#softGlow)">AVIATION PROCUREMENT &amp; LOGISTICS</text>
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#7aaadd" letter-spacing="4">BOND · RELATIONSHIP · FLOW</text>

  <!-- Decorative line under title -->
  <line x1="200" y1="72" x2="700" y2="72" stroke="#1a4a8a" stroke-width="1"/>
  <line x1="380" y1="72" x2="520" y2="72" stroke="#4499ff" stroke-width="2" filter="url(#softGlow)"/>

  <!-- ── CENTRAL AIRCRAFT ICON ── -->
  <g transform="translate(450,310)" filter="url(#glow)">
    <!-- Fuselage -->
    <ellipse cx="0" cy="0" rx="55" ry="16" fill="#1a3a6e" stroke="#4499ff" stroke-width="1.5"/>
    <!-- Wings -->
    <polygon points="-10,-8 -55,-38 -65,-30 -10,0" fill="#1a3a6e" stroke="#4499ff" stroke-width="1.2"/>
    <polygon points="10,-8 55,-38 65,-30 10,0" fill="#1a3a6e" stroke="#4499ff" stroke-width="1.2"/>
    <!-- Tail -->
    <polygon points="-40,8 -55,28 -48,30 -30,10" fill="#1a3a6e" stroke="#4499ff" stroke-width="1.2"/>
    <polygon points="40,8 55,28 48,30 30,10" fill="#1a3a6e" stroke="#4499ff" stroke-width="1.2"/>
    <!-- Nose detail -->
    <ellipse cx="48" cy="-2" rx="10" ry="6" fill="#2255aa" stroke="#4499ff" stroke-width="1"/>
    <!-- Window strip -->
    <rect x="-10" y="-4" width="40" height="5" rx="2" fill="#2266cc" opacity="0.7"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="5" fill="#4499ff" opacity="0.8"/>
  </g>

  <!-- ── PROCUREMENT NODE (Left) ── -->
  <g transform="translate(160,310)">
    <circle cx="0" cy="0" r="72" fill="#040d1a" stroke="#0066cc" stroke-width="2" opacity="0.95"/>
    <circle cx="0" cy="0" r="68" fill="url(#procurGrad)" opacity="0.25"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0066cc" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <!-- Icon: shopping/contract symbol -->
    <rect x="-18" y="-22" width="36" height="26" rx="4" fill="none" stroke="#4499ff" stroke-width="2"/>
    <line x1="-10" y1="-14" x2="10" y2="-14" stroke="#4499ff" stroke-width="1.5"/>
    <line x1="-10" y1="-8" x2="10" y2="-8" stroke="#4499ff" stroke-width="1.5"/>
    <line x1="-10" y1="-2" x2="5" y2="-2" stroke="#4499ff" stroke-width="1.5"/>
    <circle cx="8" cy="10" r="8" fill="none" stroke="#00aaff" stroke-width="2"/>
    <text x="8" y="14" text-anchor="middle" font-size="10" fill="#00aaff" font-weight="bold">$</text>
    <!-- Label -->
    <text x="0" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#66bbff">PROCUREMENT</text>
    <text x="0" y="58" text-anchor="middle" font-size="9" fill="#4488cc">Sourcing · Contracts · RFQ</text>
  </g>

  <!-- ── LOGISTICS NODE (Right) ── -->
  <g transform="translate(740,310)">
    <circle cx="0" cy="0" r="72" fill="#040d1a" stroke="#00aa88" stroke-width="2" opacity="0.95"/>
    <circle cx="0" cy="0" r="68" fill="url(#logistGrad)" opacity="0.25"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00aa88" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite"/>
    </circle>
    <!-- Icon: truck/delivery -->
    <rect x="-20" y="-16" width="28" height="18" rx="2" fill="none" stroke="#00ddaa" stroke-width="2"/>
    <polygon points="8,-16 20,-16 20,-6 8,-6" fill="none" stroke="#00ddaa" stroke-width="2"/>
    <circle cx="-10" cy="8" r="5" fill="none" stroke="#00ddaa" stroke-width="2"/>
    <circle cx="12" cy="8" r="5" fill="none" stroke="#00ddaa" stroke-width="2"/>
    <!-- Label -->
    <text x="0" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#00ddaa">LOGISTICS</text>
    <text x="0" y="58" text-anchor="middle" font-size="9" fill="#00aa88">Delivery · Tracking · MRO</text>
  </g>

  <!-- ── ANIMATED FLOW ARROWS: Procurement → Center ── -->
  <path d="M232,285 Q310,240 380,295" stroke="#4499ff" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.7" marker-end="url(#arrowBlue)">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M232,335 Q310,380 380,325" stroke="#4499ff" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.7" marker-end="url(#arrowBlue)">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- ── ANIMATED FLOW ARROWS: Center → Logistics ── -->
  <path d="M520,295 Q610,250 668,287" stroke="#00ddaa" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.7" marker-end="url(#arrowGreen)">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M520,325 Q610,370 668,333" stroke="#00ddaa" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.7" marker-end="url(#arrowGreen)">
    <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- ── BINDING ARC (top): Procurement ↔ Logistics ── -->
  <path d="M210,248 Q450,130 690,248" stroke="#ff8844" stroke-width="2.5" fill="none" stroke-dasharray="10,5" opacity="0.6" marker-end="url(#arrowOrange)">
    <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="3s" repeatCount="indefinite"/>
  </path>
  <!-- Binding arc label -->
  <text x="450" y="158" text-anchor="middle" font-size="10" fill="#ffaa66" font-weight="600" filter="url(#softGlow)">INTEGRATED SUPPLY CHAIN BOND</text>

  <!-- ── BINDING ARC (bottom): Logistics ↔ Procurement feedback ── -->
  <path d="M690,372 Q450,480 210,372" stroke="#cc44ff" stroke-width="1.5" fill="none" stroke-dasharray="6,4" opacity="0.5" marker-end="url(#arrowOrange)">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <text x="450" y="460" text-anchor="middle" font-size="10" fill="#cc88ff" opacity="0.8">REAL-TIME FEEDBACK LOOP</text>

  <!-- ── TOP SATELLITE NODES ── -->
  <!-- Vendor -->
  <g transform="translate(290,140)">
    <rect x="-42" y="-20" width="84" height="40" rx="20" fill="#040d1a" stroke="#0055aa" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#66aaff">VENDOR</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#4477aa">Selection &amp; Vetting</text>
  </g>
  <line x1="232" y1="250" x2="270" y2="160" stroke="#0066cc" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Compliance -->
  <g transform="translate(450,115)">
    <rect x="-52" y="-20" width="104" height="40" rx="20" fill="#040d1a" stroke="#ff8844" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#ffaa66">COMPLIANCE</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#cc7744">FAA · EASA · Safety</text>
  </g>
  <line x1="390" y1="130" x2="420" y2="135" stroke="#ff8844" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="510" y1="135" x2="540" y2="130" stroke="#ff8844" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Warehouse -->
  <g transform="translate(610,140)">
    <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#040d1a" stroke="#009966" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#00ddaa">WAREHOUSE</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#007755">Storage &amp; Inventory</text>
  </g>
  <line x1="668" y1="250" x2="630" y2="160" stroke="#00aa88" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ── BOTTOM SATELLITE NODES ── -->
  <!-- Budget -->
  <g transform="translate(260,490)">
    <rect x="-40" y="-20" width="80" height="40" rx="20" fill="#040d1a" stroke="#0055aa" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#66aaff">BUDGET</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#4477aa">Cost Control</text>
  </g>
  <line x1="180" y1="378" x2="240" y2="472" stroke="#0066cc" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- MRO Hub -->
  <g transform="translate(450,510)">
    <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#040d1a" stroke="#cc44ff" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#dd88ff">MRO HUB</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#aa66cc">Repair · Overhaul</text>
  </g>
  <line x1="390" y1="490" x2="405" y2="490" stroke="#cc44ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="495" y1="490" x2="510" y2="490" stroke="#cc44ff" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Last Mile -->
  <g transform="translate(640,490)">
    <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#040d1a" stroke="#009966" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-size="10" font-weight="600" fill="#00ddaa">LAST MILE</text>
    <text x="0" y="10" text-anchor="middle" font-size="8" fill="#007755">On-time Delivery</text>
  </g>
  <line x1="720" y1="378" x2="660" y2="472" stroke="#00aa88" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- ── LEGEND ── -->
  <g transform="translate(30,530)">
    <line x1="0" y1="8" x2="24" y2="8" stroke="#4499ff" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="30" y="12" font-size="9" fill="#aaccee">Procurement Flow</text>
    <line x1="130" y1="8" x2="154" y2="8" stroke="#00ddaa" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="160" y="12" font-size="9" fill="#aaccee">Logistics Flow</text>
    <line x1="250" y1="8" x2="274" y2="8" stroke="#ff8844" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="280" y="12" font-size="9" fill="#aaccee">Supply Chain Bond</text>
    <line x1="390" y1="8" x2="414" y2="8" stroke="#cc44ff" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="420" y="12" font-size="9" fill="#aaccee">Feedback Loop</text>
  </g>

  <!-- ── PULSING RINGS on center aircraft ── -->
  <circle cx="450" cy="310" r="85" fill="none" stroke="#4499ff" stroke-width="1" opacity="0.3">
    <animate attributeName="r" from="85" to="100" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="310" r="85" fill="none" stroke="#00ddaa" stroke-width="1" opacity="0.2">
    <animate attributeName="r" from="85" to="105" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.2" to="0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
</svg>
